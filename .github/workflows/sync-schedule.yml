name: Đồng bộ lịch khởi hành

on:
  schedule:
    # 03:00 và 15:00 giờ Việt Nam (UTC+7) = 20:00 và 08:00 UTC
    - cron: "0 20,8 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cài đặt thư viện
        run: pip install requests

      - name: Chạy đồng bộ lịch khởi hành
        run: python3 scripts/sync_schedule.py

      - name: Commit & push nếu có thay đổi
        run: |
          git config user.name "th-schedule-bot"
          git config user.email "actions@github.com"
          if git diff --quiet -- assets/schedule-data.js; then
            echo "Không có thay đổi, bỏ qua."
            exit 0
          fi
          git add assets/schedule-data.js
          git commit -m "chore: tự động đồng bộ lịch khởi hành từ trieuhaotravel.vn"
          git push
