name: Cập nhật sitemap và kiểm tra website
on:
  push:
    branches: [main]
    paths: ['**/*.html', 'content/*.json', 'scripts/build_sitemap.py', 'scripts/check_seo.py', '.github/workflows/seo-maintenance.yml']
  schedule:
    - cron: '30 1 * * *' # 08:30 Việt Nam
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: seo-maintenance
  cancel-in-progress: false
jobs:
  sitemap:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Kiểm tra SEO trước khi cập nhật sitemap
        run: python3 scripts/check_seo.py
      - run: python3 scripts/build_sitemap.py
      - name: Lưu sitemap nếu có thay đổi
        run: |
          if git diff --quiet -- sitemap.xml; then exit 0; fi
          git config user.name "th-seo-bot"
          git config user.email "actions@github.com"
          git add sitemap.xml
          git commit -m "chore: refresh public sitemap [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
  monitor:
    if: github.event_name != 'push'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python3 scripts/check_site.py
